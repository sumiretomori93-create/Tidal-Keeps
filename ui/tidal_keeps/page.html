<style>
:root{color-scheme:dark;--ink:#f1f8f6;--muted:#bad9df;--line:#ffffff26;--soft:#c8f1ee;--gold:#f6ddb0;--panel:#0e3d50a8}*{box-sizing:border-box}body{margin:0;background:#082b40;color:var(--ink);font:15px/1.65 system-ui,-apple-system,'Noto Sans SC',sans-serif;background-image:radial-gradient(ellipse at 38% -80px,#fff6cfa6,transparent 340px),linear-gradient(165deg,#65c7c7 0,#267f92 180px,#104762 450px,#082b40 900px);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.45;cursor:wait}button,input,textarea,select{outline-offset:4px}button:focus-visible,a:focus-visible{outline:2px solid var(--gold)}.app{max-width:760px;margin:auto;padding:26px 22px 116px;position:relative}header{display:flex;justify-content:space-between;align-items:center;gap:12px}header .brand{letter-spacing:.23em;font-size:11px;color:#e4faf6}header .small{font-size:12px;color:#e3f5ed}.icon{height:24px;width:24px;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.iconbtn{border:1px solid #ffffff40;background:#ffffff0c;border-radius:50%;height:40px;width:40px;display:grid;place-items:center}.hero{position:relative;min-height:195px;padding:25px 0 26px;isolation:isolate}.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--soft);margin:0 0 9px}h1{font-size:32px;letter-spacing:.12em;line-height:1.25;font-weight:500;margin:0 0 12px}h2{font-size:17px;font-weight:550;margin:0}h3{font-size:15px;font-weight:550;margin:0 0 8px}p{margin:7px 0}.muted{color:var(--muted);font-size:13px}.hero p{max-width:70%;color:#d8eeec;font-size:13px}.jelly{position:absolute;right:0;top:9px;width:140px;height:185px;z-index:-1;opacity:.85;filter:drop-shadow(0 0 12px #d1fff54a);transform:rotate(13deg)}.card{background:linear-gradient(145deg,#ffffff0d,#ffffff02),var(--panel);border:1px solid var(--line);border-radius:23px;padding:20px;margin:0 0 16px;box-shadow:0 12px 35px #001f3215;backdrop-filter:blur(16px)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{flex-wrap:wrap}.section{margin:26px 1px 13px}.pill{display:inline-block;font-size:11px;line-height:1.8;padding:2px 9px;border:1px solid #ffffff2a;border-radius:20px;color:#c7e6e7}.pill.gold{color:var(--gold);border-color:#f6ddb050}.quiet{background:transparent;border:0;color:var(--soft);font-size:13px;padding:9px 6px;min-height:40px}.primary,.secondary,.danger{border:1px solid #d5f7f444;border-radius:13px;padding:10px 16px;min-height:44px}.primary{background:#c9ece6;color:#173d4b;border-color:transparent}.secondary{background:#ffffff08}.danger{color:#ffd2ca;background:#652d3422;border-color:#e5a4a933}.wide{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;color:var(--muted);display:block;margin:12px 0}input,textarea,select{display:block;min-width:0;width:100%;margin-top:6px;padding:11px 12px;border:1px solid #c6edf332;border-radius:11px;background:#082e43a6;color:var(--ink);font-size:15px}textarea{resize:vertical;min-height:88px}input::placeholder,textarea::placeholder{color:#91b2c1}input[type=checkbox]{display:inline;width:auto;margin:0 8px 0 0;accent-color:#b9e6dd}.metric{font-size:30px;font-weight:350;letter-spacing:.015em}.metric small{font-size:13px;color:var(--muted)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.stats .card{margin:0;padding:16px 18px}.entry{padding:14px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}.entry:first-child{border-top:0;padding-top:3px}.entry p{white-space:pre-wrap;line-height:1.8}.meta{font-size:11px;color:var(--muted)}.empty{padding:14px 0;color:var(--muted);font-size:13px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#072c42ef;border-top:1px solid #ffffff26;backdrop-filter:blur(20px);padding:10px 10px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav button{width:20%;max-width:145px;border:0;background:transparent;color:#98b9c8;min-height:56px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:15px}.nav button.active{color:#e5f6ed;background:#c1f5e314}.nav .icon{height:23px;width:23px}.month{margin-bottom:14px}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.week span{text-align:center;font-size:11px;color:var(--muted);padding:10px 0}.day{height:48px;border:1px solid transparent;border-radius:12px;background:transparent;position:relative;font-size:14px;padding:2px}.day.today{border-color:#d5ecca80}.day.selected{background:#ccebe2;color:#163f4d}.day .dots{height:5px;display:flex;gap:3px;justify-content:center;position:absolute;bottom:6px;left:0;right:0}.dot{width:4px;height:4px;border-radius:50%;background:#eddaad}.dot.cycle{background:#e7b3c9}.dot.estimate{background:transparent;border:1px solid #dfbad9}.dot.record{background:#9ddedf}.legend{font-size:10px;color:var(--muted);margin-top:13px;display:flex;gap:12px;flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:5px}.shell{width:38px;height:38px;color:var(--gold);flex:none}.eventtitle{flex:1;min-width:0;overflow-wrap:anywhere}.count{font-size:20px;color:var(--gold);white-space:nowrap}.count small{font-size:10px;color:var(--muted)}.digest{font-family:'Noto Serif SC',serif;font-size:16px;line-height:2;white-space:pre-wrap;overflow-wrap:anywhere;padding:8px 0}.status{min-height:20px;font-size:12px;color:var(--muted)}#notice{position:fixed;top:12px;left:16px;right:16px;max-width:650px;margin:auto;background:#123d50;border:1px solid #b7d6dc70;border-radius:14px;box-shadow:0 12px 35px #001e4280;padding:12px 16px;z-index:40;display:none;font-size:13px;white-space:pre-wrap}#notice.error{background:#522e3c;color:#ffe6e0}.modal{position:fixed;inset:0;z-index:30;background:#001d32b8;display:flex;justify-content:center;align-items:flex-end;padding:14px;overflow-y:auto}.sheet{background:linear-gradient(160deg,#185168,#0b3048);border:1px solid #ffffff35;border-radius:25px;width:100%;max-width:560px;padding:22px;max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0005}.sheet h2{font-size:20px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.footer{font-size:10px;letter-spacing:.13em;color:#7eabbc;text-align:center;margin-top:30px}.recovery{border:1px solid #e6cda566;color:var(--gold);border-radius:12px;padding:10px;margin-bottom:15px;font-size:12px}.backup{min-height:220px;font:12px/1.7 monospace}.subnav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.subnav button{font-size:12px;border:1px solid #ffffff30;background:#ffffff07;border-radius:20px;padding:7px 13px}.subnav button.active{background:#ccebe2;color:#173d4b}.settingspath{overflow-wrap:anywhere;font-size:11px}body.busy .nav{opacity:.7}a{color:var(--soft)}@media(min-width:620px){.app{padding-top:35px}.hero{min-height:230px;padding-top:38px}h1{font-size:42px}.jelly{right:45px;width:180px;height:210px}.hero p{font-size:15px}.modal{align-items:center}.day{height:58px}}@media(max-width:350px){.app{padding-left:14px;padding-right:14px}.card{padding:16px}.formgrid{grid-template-columns:1fr}.hero p{max-width:63%}h1{font-size:28px}.jelly{width:110px}.day{height:43px}}
</style></head><body><div class="app"><header><div><div class="brand">TIDAL KEEPS</div><div class="small">潮汐留存</div></div><button class="iconbtn" data-action="refresh" aria-label="刷新记录"><svg class="icon" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M19 11a7 7 0 0 0-12-5M5 13a7 7 0 0 0 12 5"/></svg></button></header><main id="main" aria-live="polite"><section class="hero"><p class="eyebrow">A PLACE FOR OUR DAYS</p><h1>潮汐留存</h1><p>正在打开你的海面……</p></section></main><div class="footer">LET THE DAYS FIND THEIR SHORE</div></div><nav class="nav" aria-label="主要页面" id="nav"></nav><div id="notice" role="status"></div><div id="modal"></div>
<script>
'use strict';
const paths={calendar:'M5 4v4M19 4v4M3 10h18M5 6h14a2 2 0 0 1 2 2v12H3V8a2 2 0 0 1 2-2M7 14h3m4 0h3M7 17h3',sea:'M2 8c4-6 6 6 10 0s6 6 10 0M2 13c4-6 6 6 10 0s6 6 10 0M2 18c4-6 6 6 10 0s6 6 10 0',shell:'M12 21 3 12C-1 6 7 0 12 5c5-5 13 1 9 7l-9 9ZM12 21V5M12 21 6 6M12 21 18 6M12 21 3 10M12 21 21 10',jelly:'M4 11a8 8 0 0 1 16 0c-4 3-12 3-16 0ZM8 13c-3 4 3 5 0 9M12 14c-3 3 3 5 0 8M16 13c-3 4 3 5 0 9',drift:'M13 3l5 3-2 4 1 2-7 10-8-5L9 7h2l2-4ZM11 8l5 3M7 13l4 3'};
const icon=k=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="'+paths[k]+'"/></svg>';
const jelly='<svg class="jelly" viewBox="0 0 160 210" aria-hidden="true"><defs><radialGradient id="bell"><stop stop-color="#fbfff9" stop-opacity=".8"/><stop offset="1" stop-color="#d5edfa" stop-opacity=".12"/></radialGradient></defs><g fill="none" stroke="#e6fff8" stroke-linecap="round"><path d="M35 80C23 16 129 4 127 75Q86 112 35 80Z" fill="url(#bell)" stroke-width="1.8"/><path d="M35 80Q74 66 127 75M60 83Q43 34 93 26M96 89Q110 52 93 26" opacity=".5"/><path d="M47 89C29 123 72 132 28 188M65 94C30 128 101 139 53 205M85 98C67 127 101 149 77 193M108 89C122 122 75 138 105 181" stroke-width="1.2"/><path d="M76 98c-12 26 15 24 2 48s5 36-3 49" stroke-width="7" opacity=".22"/><circle cx="20" cy="127" r="2"/><circle cx="126" cy="158" r="1.5"/><circle cx="137" cy="33" r="2"/></g></svg>';
const titles={sea:['海面','把今天，轻轻留在这里。'],calendar:['日历','日子有了坐标，也有了期待。'],shell:['贝壳','让重要的日子，留在岸边。'],jelly:['小水母','从昨天的海底，带回一点消息。'],drift:['漂流物','每一天，都有它停留的地方。']};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=null,today='',selected='',month='',tab='sea',sub='history',cycle=null,binding=null,pickerOptions=null,dataPath='',recovered=false,busy=false,digest=null,historyPage=1,noticeTimer;
const days=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000);
const next=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*86400000).toISOString().slice(0,10);
const pretty=d=>d.slice(5).replace('-','月')+'日';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
function notice(text,error=false){clearTimeout(noticeTimer);const el=document.getElementById('notice');el.textContent=text;el.className=error?'error':'';el.style.display='block';noticeTimer=setTimeout(()=>el.style.display='none',error?12000:4200);}
async function api(action,params={}){if(!window.TidalBridge)throw Error('未连接 Operit 插件运行时。请从侧边栏重新打开。');const raw=await window.TidalBridge.request(JSON.stringify({action,params}));const out=typeof raw==='string'?JSON.parse(raw):raw;if(!out||!out.success)throw Error(out?.message||'请求未完成。');return out;}
async function refresh(){const r=await api('get_state');state=r.state;today=r.today;dataPath=r.dataPath||'';recovered=r.recovered;selected=selected||today;month=month||today.slice(0,7);cycle=(await api('get_cycle_status')).status;binding=(await api('get_binding_context')).binding||state.chatBinding||null;}
function lock(value){busy=value;document.body.classList.toggle('busy',value);document.querySelectorAll('button').forEach(b=>b.disabled=value);}
async function run(task){if(busy)return;lock(true);try{await task();}catch(e){notice(e.message||String(e),true);}finally{lock(false);}}
function hero(){return '<section class="hero"><p class="eyebrow">'+esc(today.replace(/-/g,' / '))+' · '+(tab==='sea'?'TODAY AT THE SURFACE':'TIDAL KEEPS')+'</p><h1>'+titles[tab][0]+'</h1><p>'+titles[tab][1]+'</p>'+jelly+'</section>';}
const button=(action,label,id='',cls='quiet')=>'<button type="button" class="'+cls+'" data-action="'+action+'" data-id="'+esc(id)+'">'+label+'</button>';
const empty=text=>'<p class="empty">'+text+'</p>';
function nav(){document.getElementById('nav').innerHTML=['calendar','sea','shell','jelly','drift'].map(k=>'<button data-tab="'+k+'" class="'+(tab===k?'active':'')+'" aria-current="'+(tab===k?'page':'false')+'">'+icon(k)+'<span>'+titles[k][0]+'</span></button>').join('');}
function actorLabel(r,kind){if(r?.[kind+'Name'])return r[kind+'Name'];return kind==='createdBy'?(r?.createdBy==='assistant'?'模型':'你'):(r?.updatedBy==='assistant'?'模型':'你');}
function audit(r){return (r.createdBy==='assistant'?actorLabel(r,'createdBy')+'记录':'手动记录')+(r.updatedAt&&r.updatedAt!==r.createdAt?' · '+actorLabel(r,'updatedBy')+'修改过':'');}
function notesHTML(notes){return notes.length?notes.map(n=>'<article class="entry"><div class="row"><span class="meta">'+audit(n)+'</span><div>'+button('edit-note','编辑',n.id)+button('delete-note','删除',n.id)+'</div></div><p>'+esc(n.text)+'</p></article>').join(''):empty('还没有碎片。留下一句话，就会保存在这一天。');}
function weightsHTML(weights){return weights.length?weights.slice().sort((a,b)=>Date.parse(b.recordedAt)-Date.parse(a.recordedAt)).map(w=>'<article class="entry row"><div><span class="metric">'+esc(w.value)+' <small>kg</small></span><div class="meta">'+esc(new Intl.DateTimeFormat('zh-CN',{timeZone:state.settings.timeZone,hour:'2-digit',minute:'2-digit'}).format(new Date(w.recordedAt)))+' · '+audit(w)+'</div></div>'+button('delete-weight','删除',w.id)+'</article>').join(''):empty('这一天没有体重记录。');}
function sea(){const r=state.dailyRecords[today]||{},ws=state.weights.filter(x=>x.date===today).sort((a,b)=>Date.parse(a.recordedAt)-Date.parse(b.recordedAt));return '<div class="stats"><section class="card"><span class="meta">今天的体重</span><div class="metric">'+(ws.length?esc(ws[ws.length-1].value):'—')+' <small>kg</small></div>'+button('weight','留一笔','','quiet')+'</section><section class="card"><span class="meta">睡眠时长</span><div class="metric">'+(r.sleepHours!=null?esc(r.sleepHours):'—')+' <small>小时</small></div>'+button('daily','记录今天',today)+'</section></div><section class="card"><div class="row"><h2>今天的状态</h2>'+button('daily','编辑',today)+'</div><p>'+esc(r.mood||'此刻，感觉怎么样？')+'</p>'+(r.activity?'<p class="muted">'+esc(r.activity)+'</p>':'')+'</section><div class="row section"><h2>留在海面的碎片</h2>'+button('note','＋ 写一点',today)+'</div><section class="card">'+notesHTML(r.notes||[])+'</section><div class="row section"><h2>今日靠岸</h2>'+button('event','＋ 贝壳',today)+'</div><section class="card">'+eventsHTML(state.events.filter(e=>e.date===today))+'</section>';}
function eventCount(e){const n=days(today,e.date);if(e.kind==='anniversary'&&n<0)return '<div class="count">'+(-n)+' <small>天 · 已走过</small></div>';if(n===0)return '<span class="pill gold">今天</span>';if(n>0&&e.countdown)return '<div class="count">'+n+' <small>天后</small></div>';return '<span class="pill">'+(n<0?'已过去':'待到来')+'</span>';}
function eventsHTML(events){return events.length?events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>'<article class="entry"><div class="row"><div class="shell">'+icon('shell')+'</div><div class="eventtitle"><h3>'+esc(e.title)+'</h3><span class="meta">'+esc(e.date)+(e.time?' · '+esc(e.time):'')+(e.completed?' · 已完成':'')+'</span></div>'+eventCount(e)+'</div>'+(e.note?'<p class="muted">'+esc(e.note)+'</p>':'')+'<div class="row"><span class="meta">'+audit(e)+'</span><div>'+button('edit-event','编辑',e.id)+button('delete-event','删除',e.id)+'</div></div></article>').join(''):empty('这片岸边还没有贝壳。');}
function shell(){const future=state.events.filter(e=>e.date>=today),past=state.events.filter(e=>e.date<today);return '<div class="row section"><h2>重要的日子</h2>'+button('event','＋ 收下一枚',today,'secondary')+'</div><section class="card">'+eventsHTML(future)+'</section><div class="row section"><h2>已经走过</h2><span class="meta">纪念日持续计数</span></div><section class="card">'+eventsHTML(past)+'</section>';}
function fixedHoliday(d){if(state.settings.holidaySet!=='basic')return '';return {'01-01':'元旦','02-14':'情人节','03-08':'国际妇女节','05-01':'劳动节','06-01':'儿童节','10-31':'万圣夜','12-25':'圣诞节'}[d.slice(5)]||'';}
function calendar(){const first=month+'-01',start=(new Date(first+'T00:00:00Z').getUTCDay()+6)%7;const count=new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate();let grid='<div class="week">'+['一','二','三','四','五','六','日'].map(v=>'<span>'+v+'</span>').join('')+'</div><div class="calendar">'+'<span></span>'.repeat(start);for(let i=1;i<=count;i++){const d=month+'-'+String(i).padStart(2,'0'),ev=state.events.some(e=>e.date===d)||fixedHoliday(d),actual=state.cycles.some(c=>d>=c.startDate&&d<=(c.endDate||c.startDate)),estimated=cycle?.prediction&&cycle.predictedNextStart===d,record=state.dailyRecords[d]||state.weights.some(w=>w.date===d);grid+='<button class="day '+(d===today?'today ':'')+(d===selected?'selected':'')+'" data-action="day" data-id="'+d+'" aria-label="'+d+(ev?' 有事件':'')+(actual?' 实际经期':'')+(estimated?' 预计经期':'')+'">'+i+'<span class="dots">'+(ev?'<i class="dot"></i>':'')+(actual?'<i class="dot cycle"></i>':'')+(estimated?'<i class="dot estimate"></i>':'')+(record?'<i class="dot record"></i>':'')+'</span></button>';}grid+='</div>';const r=state.dailyRecords[selected]||{};return '<section class="card"><div class="row month">'+button('month-prev','‹','','secondary')+'<h2>'+month.replace('-',' 年 ')+' 月</h2>'+button('month-next','›','','secondary')+'</div>'+grid+'<div class="legend"><span><i class="dot"></i>贝壳 / 节日</span><span><i class="dot cycle"></i>实际经期</span><span><i class="dot estimate"></i>经期估算</span><span><i class="dot record"></i>日常记录</span></div></section><div class="row section"><h2>'+esc(selected)+'</h2>'+button('day-today','回到今天')+'</div><section class="card">'+(fixedHoliday(selected)?'<p class="pill gold">'+esc(fixedHoliday(selected))+' · 公历纪念日</p>':'')+eventsHTML(state.events.filter(e=>e.date===selected))+'<div class="actions">'+button('event','＋ 贝壳',selected,'secondary')+button('daily','编辑当日记录',selected,'secondary')+'</div></section><section class="card"><h3>这一天留下的</h3>'+(r.sleepHours!=null?'<p>睡眠 '+esc(r.sleepHours)+' 小时</p>':'')+(r.mood?'<p>'+esc(r.mood)+'</p>':'')+(r.activity?'<p class="muted">'+esc(r.activity)+'</p>':'')+notesHTML(r.notes||[])+'<div class="actions">'+button('note','＋ 碎片',selected,'secondary')+button('weight','＋ 体重',selected,'secondary')+'</div>'+weightsHTML(state.weights.filter(w=>w.date===selected))+'</section>'+cycleCard();}
function cycleCard(){const text=cycle?.prediction?'按已有记录估算，下次开始约在 '+cycle.predictedNextStart+(cycle.predictedDaysRemaining<0?'。此估算日已过去，等待新的实际记录。':'。'):cycle?.reason||'记录后再估算。';return '<section class="card"><div class="row"><h2>身体的潮汐</h2>'+button('cycle','＋ 记录')+'</div><p class="muted">'+esc(text)+'</p><p class="meta">空心圆是估算，不是实际经期。未填写结束日期时，日历只标记开始日。</p>'+state.cycles.slice().sort((a,b)=>b.startDate.localeCompare(a.startDate)).map(c=>'<div class="entry"><div>'+esc(c.startDate)+' → '+esc(c.endDate||'未填结束日期')+'</div><div class="row"><span class="meta">'+audit(c)+'</span><div>'+button('edit-cycle','编辑',c.id)+button('delete-cycle','删除',c.id)+'</div></div></div>').join('')+'</section>';}
function jellyPage(){const cached=state.digestCache[today];return '<section class="card"><div class="row"><h2>晨间交接</h2><span class="pill">'+(cached?'今日已生成':'尚未正式生成')+'</span></div><p class="muted">预览会读取最新记录，不占用当天正式交接。定时唤醒与发送由 Operit 工作流负责。</p><div class="actions">'+button('preview','打捞一份预览','','primary')+(cached?button('cached','查看已生成版本','','secondary'):'')+'</div></section>'+(digest?'<section class="card"><span class="eyebrow">'+(digest.preview?'LIVE PREVIEW · 不写入缓存':'SAVED HANDOFF · 当天固定版本')+'</span><div class="digest">'+esc(digest.text)+'</div></section>':'<section class="card"><p class="muted">小水母在等你。预览里只会带回确实记录过的事情。</p></section>')+'<section class="card"><h3>让它在早晨出现</h3><p class="muted">在 Operit 配置定时工作流，调用 generate_daily_digest，再把返回的 text 交给对话步骤。插件不会自行发消息。</p><p class="meta">alreadyGenerated 表示已有当天交接，不表示已经发送成功。工作流应按日期记录投递结果，失败后使用同一份内容重试。</p></section>';}
function history(){const dates=[...new Set([...Object.keys(state.dailyRecords),...state.weights.map(x=>x.date)])].sort().reverse();return '<section class="card"><div class="formgrid"><label>从<input type="date" id="history-from"></label><label>到<input type="date" id="history-to"></label></div><label>寻找碎片<input id="history-search" placeholder="一句话、一个关键词"></label><div id="history-list">'+historyRows(dates)+'</div></section>';}
function historyRows(dates){return dates.length?dates.slice(0,historyPage*15).map(d=>{const r=state.dailyRecords[d]||{};return '<article class="entry"><div class="row"><h3>'+esc(d)+'</h3>'+button('history-day','打开这一天',d)+'</div>'+(r.mood?'<p>'+esc(r.mood)+'</p>':'')+(r.activity?'<p class="muted">'+esc(r.activity)+'</p>':'')+(r.sleepHours!=null?'<p class="muted">睡眠 '+esc(r.sleepHours)+' 小时</p>':'')+(r.notes||[]).map(n=>'<p class="muted">'+esc(n.text)+' <span class="meta">· '+audit(n)+'</span></p>').join('')+state.weights.filter(w=>w.date===d).map(w=>'<p class="muted">体重 '+esc(w.value)+' kg</p>').join('')+'</article>';}).join('')+(dates.length>historyPage*15?button('history-more','再打捞一些','','secondary'):''):empty('还没有找到记录。');}
function filterHistory(){const from=document.getElementById('history-from').value,to=document.getElementById('history-to').value,q=document.getElementById('history-search').value.trim().toLowerCase();if(from&&to&&from>to){document.getElementById('history-list').innerHTML=empty('开始日期不能晚于结束日期。');return;}const dates=[...new Set([...Object.keys(state.dailyRecords),...state.weights.map(x=>x.date)])].filter(d=>(!from||d>=from)&&(!to||d<=to)&&(!q||JSON.stringify(state.dailyRecords[d]||{}).toLowerCase().includes(q)||state.weights.some(w=>w.date===d&&String(w.value).includes(q)))).sort().reverse();document.getElementById('history-list').innerHTML=historyRows(dates);}
function settings(){const s=state.settings,b=binding||state.chatBinding||{},bound=b.chatId?'<p><strong>'+esc(b.characterName||'未指定角色')+'</strong><br><span class="meta">'+esc(b.chatTitle||b.chatId)+'</span></p>':'<p class="muted">尚未绑定。点击下方按钮选择对话和角色。</p>';return '<form class="card" data-form="settings"><h2>这片海的设置</h2><label>称呼<input name="name" maxlength="40" value="'+esc(s.name)+'"></label><label>时区<input name="timeZone" required value="'+esc(s.timeZone)+'" placeholder="Asia/Taipei"></label><p class="meta">新记录与“今天”按此时区划分；已有记录所属日期不改变。</p><label>公历纪念日<select name="holidaySet"><option value="none" '+(s.holidaySet==='none'?'selected':'')+'>不显示</option><option value="basic" '+(s.holidaySet==='basic'?'selected':'')+'>显示基础公历纪念日</option></select></label><p class="meta">不包含农历换算与地区调休；其他日期可以手动添加为贝壳。</p><label>交接中的未来倒计时范围（天）<input name="countdownDays" type="number" min="1" max="365" required value="'+s.countdownDays+'"></label><button class="primary" type="submit">保存设置</button></form><section class="card"><h2>对话与角色绑定</h2>'+bound+'<p class="meta">模型记录会使用绑定角色的名称；旧记录和无法识别角色时仍显示“模型”。</p><div class="actions">'+button('bind-current','选择对话和角色','','secondary')+(b.chatId?button('clear-binding','解除绑定','','danger'):'')+'</div></section><section class="card"><h2>档案保管</h2><p class="muted">记录保存在本机插件目录。更换设备或卸载前，请复制导出的备份并另行保存。</p><div class="actions">'+button('export','查看完整备份','','secondary')+button('legacy','导入 0.1.x 旧数据','','secondary')+'</div><p class="meta">旧版导入仅可用于空档案，不删除旧文件。需要 Operit 的 Linux 文件访问能力。</p><p class="settingspath muted">'+esc(dataPath)+'</p><p class="meta">潮汐留存 0.2.0 · 为 Operit 1.12.2 接口编写</p></section>';}
function drift(){return '<div class="subnav"><button data-action="sub-history" class="'+(sub==='history'?'active':'')+'">历史记录</button><button data-action="sub-digests" class="'+(sub==='digests'?'active':'')+'">往日交接</button><button data-action="sub-settings" class="'+(sub==='settings'?'active':'')+'">设置</button></div>'+(sub==='settings'?settings():sub==='digests'?'<section class="card">'+(Object.keys(state.digestCache).length?Object.keys(state.digestCache).sort().reverse().map(d=>'<details class="entry"><summary>'+esc(d)+'</summary><div class="digest">'+esc(state.digestCache[d].text)+'</div></details>').join(''):empty('正式生成过的晨间交接会留在这里。'))+'</section>':history());}
function render(){if(!state)return;nav();document.getElementById('main').innerHTML=hero()+(recovered?'<p class="recovery">有一份存档未通过校验，当前展示另一份有效存档。请先导出备份核对最近记录。</p>':'')+({sea,calendar,shell,jelly:jellyPage,drift}[tab])();}
let activeForm=null,lastFocus=null;
function modal(title,body,form,seed={}){lastFocus=document.activeElement;activeForm={type:form,seed,requestId:uid()};document.getElementById('modal').innerHTML='<div class="modal"><section class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="row"><h2>'+title+'</h2>'+button('close','关闭')+'</div><form data-form="modal">'+body+(form?'<div class="actions"><button class="primary" type="submit">保存</button>'+button('close','取消','','secondary')+'</div>':'')+'</form></section></div>';document.querySelector('.sheet input,.sheet textarea,.sheet button')?.focus();}
function close(){document.getElementById('modal').innerHTML='';activeForm=null;lastFocus?.focus();}
function bindingPicker(options){pickerOptions=options||{chats:[],cards:[]};const chats=pickerOptions.chats||[];const body=chats.length?chats.map((c,i)=>'<button type="button" class="secondary wide" data-action="bind-choice" data-id="'+i+'">'+esc(c.title)+(c.characterName?' · '+esc(c.characterName):'')+'</button>').join(''):'<p class="empty">没有找到可绑定的对话。</p>';modal('选择对话','<p class="muted">选择要绑定的对话。</p>'+body,null);}
const input=(label,name,type,value='',extra='')=>'<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></label>';
const area=(label,name,value='',max=4000)=>'<label>'+label+'<textarea name="'+name+'" maxlength="'+max+'">'+esc(value)+'</textarea></label>';
function openForm(kind,id){const d=id||today;if(kind==='daily'){const r=state.dailyRecords[d]||{};modal('记录这一天',input('日期','date','date',d,'required')+input('睡眠时长（小时，可留空）','sleepHours','number',r.sleepHours??'','min="0" max="48" step="0.1"')+input('状态','mood','text',r.mood||'','maxlength="2000"')+area('做过的事','activity',r.activity||'',2000),'daily');}
if(kind==='note')modal('留下一片日常',input('日期','date','date',d,'required')+area('想留下什么','text'),'note');
if(kind==='edit-note'){let n;for(const r of Object.values(state.dailyRecords)){n=r.notes.find(x=>x.id===id);if(n)break;}if(!n)throw Error('碎片不存在。');modal('修改碎片',area('正文','text',n.text),'edit-note',{id});}
if(kind==='weight')modal('记下体重',input('日期','date','date',d,'required')+input('体重（kg）','value','number','','required min="0.01" max="1000" step="0.01"')+'<p class="meta">只留记录，不评价变化。时间记为本次保存时刻。</p>','weight');
if(kind==='event'||kind==='edit-event'){const e=kind==='edit-event'?state.events.find(x=>x.id===id):{date:d,countdown:true,kind:'event'};if(!e)throw Error('贝壳不存在。');modal(kind==='event'?'收下一枚贝壳':'修改贝壳',input('名字','title','text',e.title||'','required maxlength="120"')+'<div class="formgrid">'+input('日期','date','date',e.date,'required')+input('时间（可留空）','time','time',e.time||'')+'</div><label>类型<select name="kind">'+[['event','事件'],['anniversary','纪念日'],['holiday','自定义节日']].map(([v,n])=>'<option value="'+v+'" '+(e.kind===v?'selected':'')+'>'+n+'</option>').join('')+'</select></label>'+area('备注','note',e.note||'',2000)+'<label><input name="countdown" type="checkbox" '+(e.countdown?'checked':'')+'>未来显示倒计时</label><label><input name="completed" type="checkbox" '+(e.completed?'checked':'')+'>已完成</label><p class="meta">纪念日过去后显示已走过天数，不自动按年重复。</p>',kind,{id:e.id});}
if(kind==='cycle'||kind==='edit-cycle'){const c=kind==='edit-cycle'?state.cycles.find(x=>x.id===id):{startDate:today};if(!c)throw Error('记录不存在。');modal('记录实际经期',input('开始日期','startDate','date',c.startDate,'required max="'+today+'"')+input('结束日期（可稍后填写）','endDate','date',c.endDate||'','max="'+today+'"')+'<p class="meta">至少三个开始日期后才尝试估算，估算不会成为实际记录。</p>','cycle',{id:c.id});}}
async function remove(kind,id){const names={note:'这条碎片',weight:'这条体重记录',event:'这枚贝壳',cycle:'这条经期记录'};modal('确认删除','<p>删除'+names[kind]+'？已生成的历史交接保持原样。</p><div class="actions">'+button('confirm-delete','删除',kind+':'+id,'danger')+button('close','保留','','secondary')+'</div>',null);}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||busy)return;if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0);return;}const a=b.dataset.action,id=b.dataset.id;if(!a)return;run(async()=>{if(a==='close'){close();return;}if(a==='refresh'){await refresh();render();notice('已刷新');return;}if(['daily','note','edit-note','weight','event','edit-event','cycle','edit-cycle'].includes(a)){openForm(a,id);return;}if(a.startsWith('delete-')){await remove(a.slice(7),id);return;}if(a==='confirm-delete'){const [kind,key]=id.split(':');await api('delete_'+kind,{id:key,requestId:activeForm.requestId});close();await refresh();render();notice('已删除');return;}if(a==='day'){selected=id;render();return;}if(a==='day-today'){selected=today;month=today.slice(0,7);render();return;}if(a==='history-day'){selected=id;month=id.slice(0,7);tab='calendar';render();window.scrollTo(0,0);return;}if(a==='month-prev'||a==='month-next'){const t=new Date(month+'-01T00:00:00Z');t.setUTCMonth(t.getUTCMonth()+(a==='month-prev'?-1:1));month=t.toISOString().slice(0,7);render();return;}if(a==='preview'){const r=await api('preview_daily_digest');digest={text:r.digest.text,preview:true};render();return;}if(a==='cached'){digest={text:state.digestCache[today].text,preview:false};render();return;}if(a.startsWith('sub-')){sub=a.slice(4);historyPage=1;render();return;}if(a==='history-more'){historyPage++;filterHistory();return;}if(a==='bind-current'){const r=await api('bind_current_chat');binding=r.chatBinding;state.chatBinding=r.chatBinding;render();notice('已绑定当前对话和角色');return;}if(a==='clear-binding'){await api('clear_chat_binding');binding={chatId:'',chatTitle:'',characterCardId:'',characterName:''};state.chatBinding=binding;render();notice('已解除绑定');return;}if(a==='export'){const r=await api('export_data');modal('完整档案备份','<p class="muted">长按文本选择并复制，保存到你自己的文件中。此处展示不会另建备份文件。</p><textarea class="backup" readonly aria-label="完整档案 JSON">'+esc(r.text)+'</textarea>'+button('select-backup','选中全部','','secondary'),null);return;}if(a==='select-backup'){document.querySelector('.backup').select();return;}if(a==='legacy'){modal('导入旧档案','<p>从 0.1.x 的 Linux 数据目录读取全部记录。仅限当前档案为空，旧文件保留。此操作不会导入旧版晨报缓存。</p><div class="actions">'+button('confirm-legacy','确认导入','','primary')+button('close','取消','','secondary')+'</div>',null);return;}if(a==='confirm-legacy'){const r=await api('import_legacy');close();await refresh();render();notice(r.message);return;}});});
document.addEventListener('input',e=>{if(e.target.id?.startsWith('history-')){historyPage=1;filterHistory();}if(e.target.closest('[data-form="modal"]')&&activeForm)activeForm.requestId=uid();});
document.addEventListener('submit',e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();run(async()=>{const p=Object.fromEntries(new FormData(form));let action;if(form.dataset.form==='settings'){action='save_settings';p.countdownDays=Number(p.countdownDays);}else{const f=activeForm;Object.assign(p,f.seed,{requestId:f.requestId});action={daily:'save_daily',note:'add_daily_note','edit-note':'update_note',weight:'record_weight',event:'add_event','edit-event':'update_event',cycle:'record_cycle'}[f.type];if(f.type==='event'||f.type==='edit-event'){p.countdown=form.elements.countdown.checked;p.completed=form.elements.completed.checked;}if(f.type==='daily')p.sleepHours=p.sleepHours===''?null:Number(p.sleepHours);if(f.type==='weight')p.value=Number(p.value);}await api(action,p);if(form.dataset.form==='modal')close();await refresh();render();notice('已留在这片海里');});});
document.addEventListener('keydown',e=>{const sheet=document.querySelector('.sheet');if(!sheet)return;if(e.key==='Escape'&&!busy)close();if(e.key==='Tab'){const els=[...sheet.querySelectorAll('button,input,textarea,select')].filter(x=>!x.disabled);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
run(async()=>{await refresh();render();});
</script></body></html>
